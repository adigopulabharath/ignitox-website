#==============================================================================
# NGINX SITE CONFIGURATION — IGNITOX
#==============================================================================
# TLS terminates here with a Cloudflare Origin CA certificate (free, 15-year,
# no renewal automation needed) while Cloudflare runs in "Full (strict)" mode
# in front. PLACEHOLDER: replace ignitox.com with the real domain before the
# first deploy.
#------------------------------------------------------------------------------

#------------------------------------------------------------------------------
# RATE LIMITING — outer layer; the app applies its own limiter as well
#------------------------------------------------------------------------------
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/m;
limit_req_status 429;

#------------------------------------------------------------------------------
# UPSTREAM — Next.js standalone server (compose service name)
#------------------------------------------------------------------------------
upstream nextjs {
    server web:3000;
    keepalive 32;
}

#------------------------------------------------------------------------------
# HTTP → HTTPS REDIRECT
#------------------------------------------------------------------------------
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;
    return 301 https://$host$request_uri;
}

#------------------------------------------------------------------------------
# HTTPS SERVER
#------------------------------------------------------------------------------
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name ignitox.com www.ignitox.com; # PLACEHOLDER — set the real domain
    server_tokens off;

    #--------------------------------------------------------------------------
    # TLS (Cloudflare Origin CA — placed at /etc/ssl/cloudflare on the host)
    #--------------------------------------------------------------------------
    ssl_certificate     /etc/ssl/cloudflare/origin.pem;
    ssl_certificate_key /etc/ssl/cloudflare/origin-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    #--------------------------------------------------------------------------
    # HARDENING
    #--------------------------------------------------------------------------
    include /etc/nginx/snippets/security-headers.conf;
    include /etc/nginx/snippets/cloudflare-real-ip.conf;
    client_max_body_size 64k;

    #--------------------------------------------------------------------------
    # COMPRESSION
    #--------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    #--------------------------------------------------------------------------
    # PROXY DEFAULTS
    #--------------------------------------------------------------------------
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Connection "";

    #--------------------------------------------------------------------------
    # ROUTES
    #--------------------------------------------------------------------------
    # API — stricter rate limit on top of the app's own limiter.
    location /api/ {
        limit_req zone=api burst=10 nodelay;
        proxy_pass http://nextjs;
    }

    # Everything else — static pages and immutable /_next/static assets
    # (Next.js already sets long-lived Cache-Control headers on those).
    location / {
        proxy_pass http://nextjs;
    }
}
