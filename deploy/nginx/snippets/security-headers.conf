#==============================================================================
# SECURITY HEADERS (OWASP-ALIGNED)
#==============================================================================
# Included by the HTTPS server block. `always` keeps headers on every status
# code. Notes:
#   - CSP allows 'unsafe-inline' scripts because Next.js injects an inline
#     bootstrap script into statically rendered pages; moving to nonce-based
#     CSP requires dynamic rendering and is tracked for the hardening phase.
#   - challenges.cloudflare.com is required by the Turnstile widget.
# Targets: A+ on securityheaders.com and Mozilla Observatory.
#------------------------------------------------------------------------------

add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-src https://challenges.cloudflare.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
