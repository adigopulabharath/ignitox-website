#==============================================================================
# DEPLOY WORKFLOW — BUILD IMAGE, PUSH TO GHCR, ROLL OUT OVER SSH
#==============================================================================
# Gated by repository variable DEPLOY_ENABLED=true (so the repo works before
# the server exists). Required repository secrets:
#   SSH_HOST · SSH_USER · SSH_PRIVATE_KEY · SSH_KNOWN_HOSTS (ssh-keyscan output)
# Optional repository variables:
#   SITE_URL (public origin — also used for the post-deploy health check)
#   TURNSTILE_SITE_KEY (public widget key, inlined at build time)
#------------------------------------------------------------------------------

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  #----------------------------------------------------------------------------
  # BUILD & PUSH IMAGE
  #----------------------------------------------------------------------------
  build-and-push:
    name: Build & push image
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ vars.SITE_URL }}
            NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ vars.TURNSTILE_SITE_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  #----------------------------------------------------------------------------
  # ROLL OUT TO THE VPS
  #----------------------------------------------------------------------------
  deploy:
    name: Roll out to server
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Sync deploy configuration
        run: |
          scp -i ~/.ssh/deploy_key -r deploy/* \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/opt/ignitox/"

      - name: Pull new image & restart stack
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "cd /opt/ignitox \
             && IGNITOX_IMAGE_TAG='${{ github.sha }}' docker compose pull --quiet \
             && IGNITOX_IMAGE_TAG='${{ github.sha }}' docker compose up -d --remove-orphans \
             && docker image prune -f"

      #------------------------------------------------------------------------
      # POST-DEPLOY HEALTH CHECK (only when SITE_URL is configured)
      #------------------------------------------------------------------------
      - name: Verify site is healthy
        if: ${{ vars.SITE_URL != '' }}
        run: curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors "${{ vars.SITE_URL }}" > /dev/null
